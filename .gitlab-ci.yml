stages:
  - verify
  - build
  - deploy

variables:
  DEPLOY_USER: "root"
  DEPLOY_HOST: "10.10.116.164"
  DEPLOY_DIR: "/opt/mpu"

default:
  timeout: 30 minutes
  retry:
    max: 2
    when:
      - unknown_failure
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: always
    - when: never

verify:
  stage: verify
  tags:
    - mpu
  script:
    - flutter pub get
    - flutter test

build:
  stage: build
  tags:
    - mpu
  script:
    - APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
    - echo "${APP_VERSION}.${CI_PIPELINE_IID}" > motari-latest.version
    - flutter build apk --release --android-skip-build-dependency-validation --build-name="${APP_VERSION}.${CI_PIPELINE_IID}" --build-number="${CI_PIPELINE_IID}"
    - cp build/app/outputs/flutter-apk/app-release.apk motari-latest.apk
  artifacts:
    paths:
      - motari-latest.apk
      - motari-latest.version

deploy:
  stage: deploy
  tags:
    - mpu
  script:
    - echo "Syncing latest Motari APK & version metadata to ${DEPLOY_DIR}/downloads ..."
    - ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_DIR}/downloads"
    - scp -o StrictHostKeyChecking=no motari-latest.apk motari-latest.version ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/downloads/
