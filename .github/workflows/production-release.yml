name: Production Build & Self-Update Sync

on:
  push:
    branches:
      - production
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract app version
        id: version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "${RAW_VER}" > motari-latest.version

      - name: Install dependencies & run tests
        run: |
          flutter pub get
          flutter test

      - name: Build release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk Motari.apk
          cp build/app/outputs/flutter-apk/app-release.apk motari-latest.apk

      - name: Publish GitHub Release for OTA Self-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          make_latest: true
          files: |
            Motari.apk
            motari-latest.version

      - name: Sync APK to Production Server (if SSH key configured)
        if: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_HOST != '' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/mpu' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_DIR}/downloads"
          scp -o StrictHostKeyChecking=no motari-latest.apk motari-latest.version ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/downloads/
