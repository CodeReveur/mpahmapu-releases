# Maven Central resolves to IPv6 first, and a network without an IPv6 route
# leaves the build JVM stuck on "network is unreachable" while curl on the same
# machine is fine. Ask the JVM for IPv4 and the downloads simply work.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The pub cache sits on C: and this project on D:. Kotlin's incremental
# compiler builds relative paths between the two and throws, so it compiles
# everything each time instead. Plugin sources barely change; the cost is small.
kotlin.incremental=false
