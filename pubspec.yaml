name: motari
description: "Ask Motari — the moto taxi app for MpahMapu."
publish_to: 'none'
version: 1.3.0+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Talking to the MpahMapu ride API.
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # Where the motari is, and the map they work on.
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # The offer that rings until it is answered.
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  # Pinned below 13: newer builds compile against Android SDK 37, which Google
  # now ships as "android-37.0" and this Gradle plugin cannot name. The app only
  # asks it for the notification permission and the settings screen, which this
  # line has had for years.
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/brand/
